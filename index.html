<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>juego</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body {
    margin: 0; height: 100%; background: #0e0e12; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: system-ui, -apple-system, sans-serif;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom));
    text-align: center; color: rgba(255,255,255,0.7); font-size: 15px;
    pointer-events: none; transition: opacity 0.6s;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  #ver {
    position: fixed; left: 10px; bottom: calc(8px + env(safe-area-inset-bottom));
    color: rgba(255,255,255,0.25); font-size: 11px; pointer-events: none;
  }
  #cam { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">tocá una pared vacía para sacarle una foto</div>
<div id="ver"></div>
<input id="cam" type="file" accept="image/*" capture="environment">
<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
