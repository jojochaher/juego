<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>juego</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body {
    margin: 0; height: 100%; background: #0a0a0d; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: system-ui, -apple-system, sans-serif; color: #fff;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; pointer-events: none; }
  #start {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #0a0a0d; z-index: 5; text-align: center; padding: 24px;
  }
  #start b { font-size: 22px; font-weight: 600; }
  #start span { font-size: 14px; color: rgba(255,255,255,0.5); max-width: 280px; line-height: 1.4; }
  #hint {
    position: fixed; left: 0; right: 0; top: calc(96px + env(safe-area-inset-top));
    text-align: center; color: rgba(255,255,255,0.75); font-size: 14px; line-height: 1.5;
    pointer-events: none; transition: opacity 0.8s; text-shadow: 0 1px 4px #000; padding: 0 20px; z-index: 3;
  }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.35s; z-index: 4; }
  #ver {
    position: fixed; left: 10px; top: calc(8px + env(safe-area-inset-top));
    color: rgba(255,255,255,0.25); font-size: 11px; pointer-events: none; z-index: 3;
  }
  .ctl { position: fixed; z-index: 3; touch-action: none; }
  /* joystick */
  #joy {
    left: 22px; bottom: calc(34px + env(safe-area-inset-bottom));
    width: 120px; height: 120px; border-radius: 60px;
    background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.18);
  }
  #knob {
    position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 25px;
    background: rgba(255,255,255,0.28); pointer-events: none;
  }
  /* barra de distancia */
  #dist {
    right: 10px; top: 30%; height: 34%; width: 44px;
  }
  #dist::before {
    content: ''; position: absolute; left: 20px; top: 0; bottom: 0; width: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.18);
  }
  #distKnob {
    position: absolute; left: 8px; width: 28px; height: 28px; margin-top: -14px; border-radius: 14px;
    background: rgba(255,255,255,0.75); pointer-events: none;
  }
  #dist .lab { position: absolute; right: 48px; font-size: 11px; color: rgba(255,255,255,0.4); pointer-events: none; }
  /* botones */
  .btn {
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
  }
  #shoot {
    right: 26px; bottom: calc(46px + env(safe-area-inset-bottom));
    width: 72px; height: 72px; box-sizing: border-box;
    border: 4px solid rgba(255,255,255,0.9);
  }
  #shoot::after { content: ''; width: 54px; height: 54px; border-radius: 50%; background: #fff; }
  #shoot:active::after { transform: scale(0.88); }
  #drop {
    right: 26px; bottom: calc(46px + env(safe-area-inset-bottom));
    width: 72px; height: 72px; background: rgba(255,255,255,0.92); color: #111; font-size: 32px; font-weight: 600;
  }
  #trash {
    right: 172px; bottom: calc(58px + env(safe-area-inset-bottom));
    width: 48px; height: 48px; background: rgba(255,70,60,0.85);
  }
  .btn:active { filter: brightness(0.8); }
  #top {
    position: fixed; right: 10px; left: 40px; top: calc(6px + env(safe-area-inset-top));
    display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 6px; z-index: 3; pointer-events: none;
  }
  .pill {
    position: static; pointer-events: auto;
    padding: 7px 11px; border-radius: 16px; font-size: 12px; white-space: nowrap;
    background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.75);
  }
  .pill.on { background: rgba(255,120,80,0.85); color: #fff; }
  .pill:active { background: rgba(255,255,255,0.25); }
  #equip, #unequip { display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  #equip {
    right: 26px; bottom: calc(46px + env(safe-area-inset-bottom));
    width: 72px; height: 72px; background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.3); box-sizing: border-box;
  }
  #unequip {
    right: 112px; bottom: calc(58px + env(safe-area-inset-bottom));
    width: 48px; height: 48px; background: rgba(255,255,255,0.12);
  }
  #fovPanel {
    position: fixed; left: 16px; right: 66px; top: 46%; height: 64px; z-index: 4;
    background: rgba(20,20,26,0.85); border-radius: 32px; touch-action: none;
  }
  #fovTrack { position: absolute; left: 34px; right: 74px; top: 30px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25); }
  #fovKnob { position: absolute; top: -12px; width: 28px; height: 28px; margin-left: -14px; border-radius: 14px; background: #fff; pointer-events: none; }
  #fovVal { position: absolute; right: 18px; top: 22px; font-size: 15px; color: rgba(255,255,255,0.85); pointer-events: none; }
  #salaPanel {
    position: fixed; left: 16px; right: 16px; top: calc(96px + env(safe-area-inset-top)); z-index: 4;
    background: rgba(20,20,26,0.92); border-radius: 18px; padding: 16px; text-align: center;
  }
  #salaPanel .tit { font-size: 15px; margin-bottom: 10px; }
  #salaPanel .nota { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 10px; line-height: 1.4; }
  #salaPanel .boton { display: inline-block; margin-top: 10px; padding: 9px 18px; font-size: 14px; background: rgba(255,255,255,0.9); color: #111; }
  #salaPass {
    width: 100%; box-sizing: border-box; padding: 11px 12px; font-size: 16px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff;
    -webkit-user-select: text; user-select: text; touch-action: manipulation; outline: none;
  }
  #modes {
    position: fixed; left: 0; right: 0; bottom: calc(176px + env(safe-area-inset-bottom));
    display: flex; justify-content: center; gap: 6px; z-index: 3; pointer-events: none;
  }
  #modes .pill { pointer-events: auto; }
  #modes .pill.on { background: rgba(255,255,255,0.9); color: #111; }
  #cancel {
    right: 112px; bottom: calc(58px + env(safe-area-inset-bottom));
    width: 48px; height: 48px; background: rgba(255,255,255,0.18); color: #fff; font-size: 20px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="vid" playsinline muted autoplay></video>
<div id="hint"></div>
<div id="flash"></div>
<div id="joy" class="ctl" style="display:none"><div id="knob"></div></div>
<div id="dist" class="ctl" style="display:none"><span class="lab" style="top:-6px">lejos</span><span class="lab" style="bottom:-6px">cerca</span><div id="distKnob"></div></div>
<div id="shoot" class="ctl btn" style="display:none" aria-label="sacar foto"></div>
<div id="drop" class="ctl btn" style="display:none" aria-label="soltar">✓</div>
<div id="trash" class="ctl btn" style="display:none" aria-label="borrar">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
</div>
<div id="top">
  <div id="salaBtn" class="ctl pill" style="display:none">sala</div>
  <div id="home" class="ctl pill" style="display:none">inicio</div>
  <div id="gyroT" class="ctl pill" style="display:none"></div>
  <div id="fov" class="ctl pill" style="display:none"></div>
  <div id="inv" class="ctl pill" style="display:none"></div>
</div>
 <div id="modes" style="display:none">
  <div class="pill" data-m="mover">mover</div>
  <div class="pill" data-m="recortar">recortar</div>
  <div class="pill" data-m="encuadre">encuadre</div>
  <div class="pill" data-m="girar">girar</div>
  <div class="pill" id="reset" aria-label="restablecer">↺</div>
</div>
<div id="equip" class="ctl" style="display:none" aria-label="equipar cámara"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
<div id="unequip" class="ctl" style="display:none" aria-label="guardar cámara"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/><path d="M3 3l18 18" stroke-linecap="round"/></svg></div>
<div id="fovPanel" style="display:none"><div id="fovTrack"><div id="fovKnob"></div></div><span id="fovVal"></span></div>
<div id="salaPanel" style="display:none">
  <div id="salaFuera">
    <div class="tit">museo compartido</div>
    <input id="salaPass" type="password" placeholder="contraseña de la sala" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div id="salaEntrar" class="pill boton">entrar</div>
    <div class="nota">misma contraseña = mismo museo. compartila solo con quien quieras que entre.</div>
  </div>
  <div id="salaDentro" style="display:none">
    <div class="tit">estás en una sala compartida</div>
    <div id="salaGente" class="nota"></div>
    <div id="salaSalir" class="pill boton">volver a mi museo</div>
  </div>
</div>
<div id="cancel" class="ctl btn" style="display:none" aria-label="cancelar">✕</div>
<div id="start"><b>tocá para entrar</b><span>te va a pedir permiso para el movimiento y la cámara</span></div>
<div id="ver"></div>
<script src="sala.js"></script>
<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
